[project]
name = "FunVIP"
version = "0.6.0"
description = "Fungal Validation & Identification Pipeline"
authors = [{name = "Changwan Seo", email = "wan101010@snu.ac.kr"}]
urls = { "Homepage" = "https://github.com/Changwanseo/FunVIP" }
requires-python = ">=3.9, <3.14"
license = {text = "GPL-3.0"}
dependencies = [
    "biopython>=1.84",
    # ete4 has no Windows wheel on PyPI and cannot compile there, so it is a
    # dependency only off Windows. On Windows, FunVIP installs a prebuilt ete4
    # wheel bundled under funvip/_vendor/ete4_wheels on first run (see
    # _ensure_ete4 in main.py); the wheel is installed with --no-deps, so ete4's
    # own runtime deps are listed as Windows-only dependencies just below.
    "ete4>=4.4.0,<4.5.0; platform_system != 'Windows'",
    "bottle; platform_system == 'Windows'",
    "cheroot; platform_system == 'Windows'",
    "brotli; platform_system == 'Windows'",
    "requests; platform_system == 'Windows'",
    "Cython",
    "contourpy>=1.0",
    "dendropy>=4.0.0, <5.0.0",
    "GenMine>=1.3.0, <1.5.0",
    "lxml",
    "matplotlib",
    "numpy>=1.20.0,<2.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.2,<4.0.0",
    "psutil",
    "pyyaml",
    "sip>=4.19.4",
    "scikit-learn",
    "scipy",
    "tabulate",
    "unidecode>=1.2.0",
    "xlrd>=2.0.1",
    "xlsxwriter",
    "xmltodict>=0.12.0,<1.0.0",
    "PyQt6>=6.0.0; sys_platform!='darwin'",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.scripts]
FunID = "funvip.main:main"
FunVIP = "funvip.main:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["funvip", "funvip.src", "funvip.external", "funvip.data", "funvip.preset", "funvip.test_dataset", "funvip._vendor" ]

[tool.setuptools.package-data]
funvip = ["data/*", "external/*", "preset/*", "src/*", "test_dataset/*"]
"funvip._vendor" = ["ete4_wheels/*.whl", "ete4_wheels/*.txt", "ete4_wheels/LICENSE*", "ete4_wheels/README*"]


[build-system]
requires = ["setuptools", "setuptools-ext", "wheel"]
build-backend = "setuptools_ext"

[metadata]
obsoletes-dist = "FunID"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that shell out to external tools (deselected by default)",
]
addopts = "-m 'not integration'"


